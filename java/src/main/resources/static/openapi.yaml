openapi: 3.0.3
info:
  title: XA Bank Time Deposits API
  version: 1.0.0
  description: Lists time deposits and applies monthly interest to their balances.
tags:
  - name: TimeDeposits
paths:
  /time-deposits:
    get:
      tags: [ TimeDeposits ]
      operationId: getTimeDeposits
      summary: List all time deposits with their withdrawals
      responses:
        '200':
          description: All time deposits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDeposit'
  /time-deposits/balances:
    post:
      tags: [ TimeDeposits ]
      operationId: updateBalances
      summary: Apply one month of interest to every time deposit
      description: >
        Not idempotent: each call adds another month of interest. Read the new balances with
        GET /time-deposits.
      responses:
        '204':
          description: Balances updated
components:
  schemas:
    TimeDeposit:
      type: object
      required: [ id, planType, balance, days, withdrawals ]
      properties:
        id:
          type: integer
          format: int32
          example: 2
        planType:
          type: string
          # plain string, not an enum: unknown plan types are valid and earn no interest
          description: Known plan types are basic, student and premium.
          example: basic
        balance:
          type: number
          example: 1235595.81
        days:
          type: integer
          format: int32
          example: 45
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required: [ id, amount, date ]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          example: 500.00
        date:
          type: string
          format: date
          example: '2026-01-15'
